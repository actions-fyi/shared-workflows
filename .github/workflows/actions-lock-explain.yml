name: Explain Actions Lockfile
# "Validate Actions Lockfile" is actions-lock.yml on pull requests and actions-lock-push.yml on
# main; this listener reports their failures and resolves the reports when they pass. A
# workflow_run trigger matches workflows by name, not by file, so those two keep a full name of
# their own instead of the bare Validate. "Check Actions Lockfile" is their old name, which
# branches cut before the rename still run under; remove it once those are gone.
on:
  workflow_run:
    workflows: ["Validate Actions Lockfile", "Check Actions Lockfile"]
    types: [completed]

permissions: {}

jobs:
  explain:
    name: Explain
    # Not in a fork: Claude needs the org's secrets, and a failure on main would open an issue in
    # the fork.
    if: github.repository_owner == 'actions-fyi'
    cache-mode: none
    permissions:
      actions: read # Read the run's jobs and download their logs
      contents: read # Check out the default branch for the screen job
      issues: write # Open, comment on and close the issue of a failure on main
      pull-requests: write # Find the pull request; create, update and minimize the comment
    uses: $/.github/workflows/_explain.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
