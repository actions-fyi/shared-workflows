name: Re-run Lint Metadata
# A reusable workflow, not a ruleset workflow. It lives in actions-fyi/shared-workflows, which
# releases it under immutable tags. The PR Metadata listener of consumer repositories calls it by
# full path and tag; this repository's own listener calls it with `$/`. It is called by a
# workflow_run listener, so inside it github.event is the workflow_run payload, and the token is the
# base repository's.
#
# The caller's trigger: workflow_run on "Relay Title Edit" (_title-edit.yml), completed. So
# github.event.workflow_run is the relay's run.
#
# The _ prefix marks a shared workflow: called only with workflow_call, never by events or rulesets.
#
# Lint Metadata, the org ruleset workflow that checks the title, runs only on the default activity
# types of pull_request, since rulesets ignore event filters. Editing a title is not one of them, so
# a title fixed by hand stays red until someone re-runs the check, and one edited into an invalid
# title stays green. The relay runs on edited pull requests, and its relay job runs when the title
# is what changed. A run whose jobs were all skipped completes too, so this reads the relay job's
# conclusion before it acts. When the title changed, it re-runs the latest Lint Metadata run of the
# pull request's head commit: the failed jobs of a run that failed, the whole run of one that
# passed. The check reads the title through the API, so the re-run sees the new one.
#
# A run that is still queued or in progress is left alone, as is a head commit without a run, such
# as one in a repository the ruleset doesn't cover. A re-run is that run's second attempt, which
# _pr-metadata.yml ignores, so a title edited by hand is never rewritten. _pr-metadata.yml's own
# title fix uses the job's token, whose edit starts no workflow, so it doesn't re-run twice.
#
# Under pull_request, fork pull requests get a read-only token, so the relay can't re-run anything.
# Under workflow_run this gets a write token, for fork pull requests too, which makes the relay's
# run untrusted input to a privileged run: the job reads nothing from it but its head SHA and its
# jobs' conclusions, checks nothing out and runs no code of it. Its token can only re-run workflow
# runs.
#
# The calling job must grant what the rerun job declares, or the call fails before anything runs:
#   actions: write   # read the relay run's jobs; re-run the Lint Metadata runs
#   contents: read   # the egress firewall reads .github/egress-firewall.yaml
on:
  workflow_call:

permissions: {}

env:
  # The relay job's name ends with this; callers add a prefix.
  RELAY_JOB: Relay Title Edit

jobs:
  rerun:
    name: Re-run Lint Metadata
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 5
    # Edits in quick succession re-run the check once, for the last of them.
    concurrency:
      group: metadata-rerun-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    permissions:
      contents: read # The egress firewall reads .github/egress-firewall.yaml with this token
      actions: write # Read the relay run's jobs; re-run the Lint Metadata runs
    steps:
      - name: Re-run Lint Metadata
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const head_sha = run.head_sha;

            let jobs;
            try {
              jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100,
              });
            } catch (error) {
              core.warning(`Couldn't list the jobs of ${run.html_url}: ${error.message}`);
              return;
            }
            if (!jobs.some((j) => j.name.endsWith(process.env.RELAY_JOB) && j.conclusion === 'success')) {
              core.notice('The title didn\'t change, so nothing is re-run.');
              return;
            }

            let runs;
            try {
              runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha, event: 'pull_request', per_page: 100,
              });
            } catch (error) {
              core.warning(`Couldn't list the workflow runs for ${head_sha}: ${error.message}`);
              return;
            }
            // Check Metadata is the old name, which a caller that isn't renamed yet still runs under.
            // Each workflow's latest run counts: an older one checked an older state of the pull
            // request.
            const names = ['Lint Metadata', 'Check Metadata'];
            const latest = new Map();
            for (const r of runs.filter((r) => names.includes(r.name))) {
              const seen = latest.get(r.workflow_id);
              if (!seen || r.id > seen.id) latest.set(r.workflow_id, r);
            }
            if (latest.size === 0) {
              core.notice(`No Lint Metadata run for ${head_sha}, so nothing is re-run.`);
              return;
            }
            for (const r of latest.values()) {
              if (r.status !== 'completed') {
                core.notice(`${r.html_url} is ${r.status}, so it is left to finish.`);
                continue;
              }
              try {
                if (r.conclusion === 'success') {
                  await github.rest.actions.reRunWorkflow({ owner, repo, run_id: r.id });
                  core.notice(`Re-ran ${r.html_url}, which passed for the old title.`);
                } else {
                  await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: r.id });
                  core.notice(`Re-ran the failed jobs of ${r.html_url}, which ended in ${r.conclusion}.`);
                }
              } catch (error) {
                core.warning(`Couldn't re-run ${r.html_url}: ${error.message}`);
              }
            }
