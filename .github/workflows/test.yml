name: Test
# Tests the lower-level shared workflow _screen.yml, which other shared workflows call rather than
# any event. The top-level ones have callers of their own in this repository (actions-lock.yml,
# zizmor.yml, renovate.yml), so their pull requests already run them.
#
# Every call must pass:
# - Screen calls _screen.yml with a harmless text, which must pass both the deterministic check and
#   Claude Haiku's verdict.
# - Screen Blocks Token, Screen Blocks Token (base64) and Screen Blocks Credential call _screen.yml
#   with a text that must be blocked: a dummy token, passed in as the secret, raw and
#   base64-encoded, and a GitHub token shape. Prepare Screen builds these at run time, so no
#   secret-shaped string sits in the repository. They pass expect-block, so they pass when the
#   text is blocked.
# - Screen Verdicts fails unless every call succeeded. It is the job to make required, not the
#   calls it checks.
#
# Pull requests from this repository only: fork pull requests get no secrets, so every job skips
# on them, and a skipped Screen Verdicts counts as passed. The same holds in the merge queue, which
# waits for every required check: the tests ran on the pull request before it was queued.
on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  screen:
    name: Screen
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read # Check out the default branch, which claude-code-action needs on pull requests
    uses: $/.github/workflows/_screen.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      text: |
        Test of _screen.yml: the workflow .github/workflows/test.yml uses actions/checkout@v7.0.1,
        locked at commit 3d3c42e5aac5ba805825da76410c181273ba90b1. Run gh actions-lock and push the
        result.
      context: |
        A harmless test text from this repository's own test workflow: one or two sentences that
        name a workflow file, an action and its version, a commit SHA (40 hex characters) and a
        command.

  screen-inputs:
    name: Prepare Screen
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {} # None: only writes job outputs
    outputs:
      token: ${{ steps.values.outputs.token }}
      token-base64: ${{ steps.values.outputs.token-base64 }}
      credential-suffix: ${{ steps.values.outputs.credential-suffix }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Build Test Values
        id: values
        run: |
          token=dummy-screen-test-token-0123456789
          # Only the part after gh: GitHub drops a job output that looks like a token, so the
          # call builds the whole credential in its input.
          credential_suffix="p_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          {
            echo "token=$token"
            echo "token-base64=$(printf '%s' "$token" | base64 -w0)"
            echo "credential-suffix=$credential_suffix"
          } >> "$GITHUB_OUTPUT"

  screen-block-token:
    name: Screen Blocks Token
    needs: screen-inputs
    permissions:
      contents: read # Check out the default branch, which claude-code-action needs on pull requests
    uses: $/.github/workflows/_screen.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.screen-inputs.outputs.token }}
    with:
      text: "Test of _screen.yml, which must block this: ${{ needs.screen-inputs.outputs.token }}"
      context: A test text from this repository's own test workflow, which must be blocked.
      expect-block: true

  screen-block-token-base64:
    name: Screen Blocks Token (base64)
    needs: screen-inputs
    permissions:
      contents: read # Check out the default branch, which claude-code-action needs on pull requests
    uses: $/.github/workflows/_screen.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.screen-inputs.outputs.token }}
    with:
      text: "Test of _screen.yml, which must block this: ${{ needs.screen-inputs.outputs.token-base64 }}"
      context: A test text from this repository's own test workflow, which must be blocked.
      expect-block: true

  screen-block-credential:
    name: Screen Blocks Credential
    needs: screen-inputs
    permissions:
      contents: read # Check out the default branch, which claude-code-action needs on pull requests
    uses: $/.github/workflows/_screen.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.screen-inputs.outputs.token }}
    with:
      text: "Test of _screen.yml, which must block this: gh${{ needs.screen-inputs.outputs.credential-suffix }}"
      context: A test text from this repository's own test workflow, which must be blocked.
      expect-block: true

  screen-verdicts:
    name: Screen Verdicts
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    needs: [screen, screen-block-token, screen-block-token-base64, screen-block-credential]
    runs-on: ubuntu-latest
    permissions: {} # None: only reads the results of the calls
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Check Screen Verdicts
        env:
          CLEAN: ${{ needs.screen.result }}
          TOKEN: ${{ needs.screen-block-token.result }}
          TOKEN_BASE64: ${{ needs.screen-block-token-base64.result }}
          CREDENTIAL: ${{ needs.screen-block-credential.result }}
        run: |
          status=0
          expect() {
            if [[ "$3" != "$2" ]]; then
              echo "::error::$1 ended with ${3:-no result}, expected $2."
              status=1
            fi
          }
          expect "Screen" success "$CLEAN"
          expect "Screen Blocks Token" success "$TOKEN"
          expect "Screen Blocks Token (base64)" success "$TOKEN_BASE64"
          expect "Screen Blocks Credential" success "$CREDENTIAL"
          exit "$status"
