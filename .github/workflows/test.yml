name: Test
# Tests the lower-level shared workflows, _screen.yml and _explain.yml, which other shared workflows
# call rather than any event. The top-level ones have callers of their own in this repository
# (actions-lock.yml, zizmor.yml, renovate.yml), so their pull requests already run them.
#
# A job that calls a reusable workflow can't continue on error, so a call that must fail shows as a
# failed job in the run:
# - Screen calls _screen.yml with a harmless text, which must pass both the deterministic check and
#   Claude Haiku's verdict.
# - Screen Blocks Token, Screen Blocks Token (base64) and Screen Blocks Credential call _screen.yml
#   with a text that must be blocked: a dummy token, passed in as the secret, raw and
#   base64-encoded, and a GitHub token shape. Prepare Screen builds these at run time, so no
#   secret-shaped string sits in the repository. These jobs are expected to show as failed.
# - Screen Verdicts fails unless Screen succeeded and every blocking call failed. It is the job to
#   make required, not the calls it checks.
# - Explain calls _explain.yml with a synthetic results artifact, which Prepare Explain uploads, and
#   Explain Outputs checks that it returned a title and a body. _explain.yml only posts on pull
#   requests, so this run posts nothing.
#
# Merge queue only: the queue branch belongs to this repository, so the jobs always get the
# secrets, and fork pull requests never run it.
on:
  merge_group:

permissions: {}

# Each merge group entry has its own ref, so merge groups never share a group.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  screen:
    name: Screen
    permissions:
      contents: read # Check out the default branch, which claude-code-action needs on pull requests
    uses: $/.github/workflows/_screen.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      text: |
        Test of _screen.yml: the workflow .github/workflows/test.yml uses actions/checkout@v7.0.1,
        locked at commit 3d3c42e5aac5ba805825da76410c181273ba90b1. Run gh actions-lock and push the
        result.
      context: |
        A harmless test text from this repository's own test workflow: one or two sentences that
        name a workflow file, an action and its version, a commit SHA (40 hex characters) and a
        command.

  screen-inputs:
    name: Prepare Screen
    runs-on: ubuntu-latest
    permissions: {} # None: only writes job outputs
    outputs:
      token: ${{ steps.values.outputs.token }}
      token-base64: ${{ steps.values.outputs.token-base64 }}
      credential: ${{ steps.values.outputs.credential }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit
      - name: Build Test Values
        id: values
        run: |
          token=dummy-screen-test-token-0123456789
          credential="gh"
          credential+="p_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          {
            echo "token=$token"
            echo "token-base64=$(printf '%s' "$token" | base64 -w0)"
            echo "credential=$credential"
          } >> "$GITHUB_OUTPUT"

  screen-block-token:
    name: Screen Blocks Token
    needs: screen-inputs
    permissions:
      contents: read # Check out the default branch, which claude-code-action needs on pull requests
    uses: $/.github/workflows/_screen.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.screen-inputs.outputs.token }}
    with:
      text: "Test of _screen.yml, which must block this: ${{ needs.screen-inputs.outputs.token }}"
      context: A test text from this repository's own test workflow, which must be blocked.

  screen-block-token-base64:
    name: Screen Blocks Token (base64)
    needs: screen-inputs
    permissions:
      contents: read # Check out the default branch, which claude-code-action needs on pull requests
    uses: $/.github/workflows/_screen.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.screen-inputs.outputs.token }}
    with:
      text: "Test of _screen.yml, which must block this: ${{ needs.screen-inputs.outputs.token-base64 }}"
      context: A test text from this repository's own test workflow, which must be blocked.

  screen-block-credential:
    name: Screen Blocks Credential
    needs: screen-inputs
    permissions:
      contents: read # Check out the default branch, which claude-code-action needs on pull requests
    uses: $/.github/workflows/_screen.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.screen-inputs.outputs.token }}
    with:
      text: "Test of _screen.yml, which must block this: ${{ needs.screen-inputs.outputs.credential }}"
      context: A test text from this repository's own test workflow, which must be blocked.

  screen-verdicts:
    name: Screen Verdicts
    if: always()
    needs: [screen, screen-block-token, screen-block-token-base64, screen-block-credential]
    runs-on: ubuntu-latest
    permissions: {} # None: only reads the results of the calls
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit
      - name: Check Screen Verdicts
        env:
          CLEAN: ${{ needs.screen.result }}
          TOKEN: ${{ needs.screen-block-token.result }}
          TOKEN_BASE64: ${{ needs.screen-block-token-base64.result }}
          CREDENTIAL: ${{ needs.screen-block-credential.result }}
        run: |
          status=0
          expect() {
            if [[ "$3" != "$2" ]]; then
              echo "::error::$1 ended with ${3:-no result}, expected $2."
              status=1
            fi
          }
          expect "Screen" success "$CLEAN"
          expect "Screen Blocks Token" failure "$TOKEN"
          expect "Screen Blocks Token (base64)" failure "$TOKEN_BASE64"
          expect "Screen Blocks Credential" failure "$CREDENTIAL"
          exit "$status"

  explain-results:
    name: Prepare Explain
    runs-on: ubuntu-latest
    permissions: {} # None: uploading an artifact needs no token scope
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit
      - name: Write Synthetic Results
        run: |
          results="$RUNNER_TEMP/explain-test-results"
          mkdir -p "$results"
          cat > "$results/test.log" <<'EOF'
          Run ./scripts/check-example.sh
          checking example.txt
          error: example.txt: missing trailing newline (synthetic failure for the _explain.yml test)
          Error: Process completed with exit code 1.
          EOF
      # Replaces the artifact when a re-run of all jobs uploads it again.
      - name: Upload Results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: explain-test-results
          path: ${{ runner.temp }}/explain-test-results/
          if-no-files-found: error
          overwrite: true

  explain:
    name: Explain
    needs: explain-results
    permissions:
      contents: read # Check out the merge group's commit, so Claude can read it
      pull-requests: write # Declared by the comment job of _explain.yml, which merge groups skip
    uses: $/.github/workflows/_explain.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      results: explain-test-results
      marker: "<!-- shared-workflows-explain-test -->"
      allowed-bots: renovate[bot]
      screen-context: >-
        This is a test of _explain.yml, so the explanation may say that it is a test and name the
        synthetic file example.txt and the script scripts/check-example.sh.
      prompt: |
        REPO: ${{ github.repository }}

        This is a test run of the shared workflow _explain.yml, not a real failure. The results
        directory holds test.log, the synthetic log of a made-up check.

        Write a short PR comment in GitHub Markdown: one sentence saying that this comment is a
        test of _explain.yml from the Test workflow, then one or two sentences on what test.log
        reports. Don't read other files. No preamble, no headings, no praise.

  explain-outputs:
    name: Explain Outputs
    needs: explain
    runs-on: ubuntu-latest
    permissions: {} # None: only reads the call's outputs
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit
      # The outputs passed the screen, so their length may be printed, but not their text.
      - name: Check Explain Outputs
        env:
          TITLE: ${{ needs.explain.outputs.title }}
          BODY: ${{ needs.explain.outputs.body }}
        run: |
          if [[ -z "${TITLE//[[:space:]]/}" || -z "${BODY//[[:space:]]/}" ]]; then
            echo "::error::_explain.yml returned no title or no body."
            exit 1
          fi
          echo "::notice::_explain.yml returned a title of ${#TITLE} and a body of ${#BODY} characters."
