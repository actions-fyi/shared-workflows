name: PR Title
# Exists so pr-metadata.yml can re-run Lint Metadata after a title edit, for fork pull requests too.
# Lint Metadata runs only on the default activity types of pull_request, and editing a title is not
# one of them. This workflow runs on the edited type and does nothing itself: its run completing
# starts the PR Metadata listener, which has the write token a re-run needs; see
# _metadata-rerun.yml.
#
# It runs on pull_request, so with a read-only token and no secrets on fork pull requests, and with
# the pull request's own copy of this file. It reads nothing from the pull request and runs no code
# of it. A first-time contributor's run waits for approval like any other.
#
# The edited type covers the description and the base branch too. The job runs only when the title
# changed, so any other edit ends in a skipped run, which the listener ignores.
#
# pr-metadata.yml listens to runs of this name, so the name stays as it is.
on:
  pull_request:
    types: [edited]

permissions: {}

jobs:
  record:
    name: Record Title Edit
    # Not in a fork: it only starts the listener, which skips in forks.
    if: github.repository_owner == 'actions-fyi' && github.event.changes.title != null
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 5
    permissions:
      contents: read # The egress firewall reads .github/egress-firewall.yaml with this token
    steps:
      - name: Record Title Edit
        run: echo "::notice::Title edit recorded for the PR Metadata listener"
