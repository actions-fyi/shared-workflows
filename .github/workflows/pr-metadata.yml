name: PR Metadata
# Lint Metadata is the org ruleset workflow that checks the title. Its runs on pull requests start
# this listener, which runs with the secrets and a write token, for fork pull requests too. A
# workflow_run trigger matches workflows by name, not by file, so that workflow keeps a full name
# of its own instead of the bare Lint. "Check Metadata" is its old name, which branches cut before
# the rename still run under; remove it once those are gone.
#
# A title edit starts no run of Lint Metadata, so the same listener also follows Relay Title Edit,
# title-edit.yml, which runs on edited pull requests, where the rerun job re-runs Lint Metadata when
# the title changed; see _metadata-rerun.yml. Each job runs only on its own workflows' runs, and the
# rerun job gets no secrets.
on:
  workflow_run:
    workflows: ["Lint Metadata", "Check Metadata", "Relay Title Edit"]
    types: [completed]

permissions: {}

jobs:
  metadata:
    name: Metadata
    # Not in a fork: Claude and Prompt Guard need the org's secrets, which a fork doesn't get.
    if: >-
      github.repository_owner == 'actions-fyi'
      && (github.event.workflow_run.name == 'Lint Metadata'
        || github.event.workflow_run.name == 'Check Metadata')
    cache-mode: none
    permissions:
      actions: write # Re-run the failed Lint Metadata jobs
      contents: read # Check out the default branch for the screen jobs
      id-token: write # Log in to OpenBao for Prompt Guard
      issues: write # Read the repository's labels, label the pull request, and escalate a flag
      pull-requests: write # Read the pull request; apply the title, labels and description
    uses: $/.github/workflows/_pr-metadata.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PROMPT_GUARD_CLIENT_ID: ${{ secrets.PROMPT_GUARD_CLIENT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  rerun:
    name: Re-run Lint Metadata
    # Not in a fork: nothing there listens for the runs it would re-run.
    if: >-
      github.repository_owner == 'actions-fyi'
      && github.event.workflow_run.name == 'Relay Title Edit'
    # A low-trust trigger: the rerun job needs no cache.
    cache-mode: none
    # What the rerun job of _metadata-rerun.yml declares; a called job can't get more.
    permissions:
      actions: write # Read the relay run's jobs; re-run the Lint Metadata runs
      contents: read # The egress firewall reads .github/egress-firewall.yaml with this token
    uses: $/.github/workflows/_metadata-rerun.yml
