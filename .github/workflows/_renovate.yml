name: Validate
# A reusable workflow, not a ruleset workflow. It lives in actions-fyi/shared-workflows, which
# releases it under immutable tags, and holds the Renovate config checks that used to be
# renovate.yml of actions-fyi/.github. Workflows in other repositories, ruleset workflows included,
# call it by full path and tag: in a ruleset workflow, GitHub resolves `$/` against the target
# repository, where this file doesn't exist.
# This repository's own renovate.yml calls it with `uses: $/.github/workflows/_renovate.yml`. It
# runs as part of the caller's run, in the target repository's context: the caller's event, token
# and secrets.
#
# The _ prefix marks a shared workflow: called only with workflow_call, never by events or rulesets.
#
# The calling job must grant the union of what the jobs below declare, or the call fails before
# anything runs:
#   contents: read   # renovate, upstream, fix: read the Renovate configs
#   id-token: write  # fix: exchange the job's OIDC token with Octo STS
#
# Events: the renovate and upstream jobs run on any event, e.g. pull_request, merge_group and push.
# The fix job only runs on pull requests from a branch of the same repository.
on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

env:
  SCHEMA_URL: https://docs.renovatebot.com/renovate-schema.json
  UPSTREAM: github>actions-fyi/.github

jobs:
  renovate:
    name: Renovate Config
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.ref }}
    permissions:
      contents: read # Read the Renovate configs
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Find Configs
        id: files
        run: >-
          echo "files=$(git ls-files --
          renovate.json renovate.jsonc renovate.json5
          .github/renovate.json .github/renovate.jsonc .github/renovate.json5
          .gitlab/renovate.json .gitlab/renovate.jsonc .gitlab/renovate.json5
          .renovaterc .renovaterc.json .renovaterc.jsonc .renovaterc.json5
          default.json
          | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
      - name: Validate Config
        if: steps.files.outputs.files != ''
        uses: suzuki-shunsuke/github-action-renovate-config-validator@v2.4.1
        with:
          strict: true
          config_file_path: ${{ join(fromJSON(steps.files.outputs.files), ' ') }}

  upstream:
    name: Renovate Upstream
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-check-${{ github.ref }}
    permissions:
      contents: read # Read the Renovate configs
    outputs:
      missing: ${{ steps.upstream.outputs.missing }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Find Missing Upstream
        id: upstream
        # default.json is the upstream preset itself, so it only needs $schema
        run: |
          git ls-files -- \
            renovate.json .github/renovate.json .gitlab/renovate.json \
            .renovaterc .renovaterc.json default.json \
          | while read -r file; do
            jq -c --arg file "$file" --arg url "$SCHEMA_URL" --arg upstream "$UPSTREAM" '
              [ (if .["$schema"] == $url then empty else "$schema" end),
                (if $file == "default.json" or any(.extends[]?;
                    sub("^local>"; "github>") | . == $upstream or startswith($upstream + "#"))
                  then empty else "extends" end) ]
              | select(length > 0) | {file: $file, missing: .}' "$file"
          done \
          | jq -sc . | sed 's/^/missing=/' >> "$GITHUB_OUTPUT"
      - name: Fail on Missing Upstream
        if: steps.upstream.outputs.missing != '[]'
        env:
          MISSING: ${{ steps.upstream.outputs.missing }}
        run: |
          jq -r --arg url "$SCHEMA_URL" --arg upstream "$UPSTREAM" '.[]
            | "::error file=\(.file)::Missing " + (.missing | map(
                if . == "$schema" then "\"$schema\": \"\($url)\""
                else "\"\($upstream)\" in \"extends\"" end) | join(" and "))' <<< "$MISSING"
          exit 1

  # Commits the fix to the pull request's branch, so the author doesn't have to. Only on pull
  # requests from a branch of this repository: a fork's pull request gets no OIDC token, so it
  # keeps the failed check and the upstream job's annotation on the file.
  #
  # Nothing is checked out. The job reads each config at the pull request's head through the API,
  # adds only the missing lines, and commits the files with createCommitOnBranch, which GitHub
  # signs, and which only lands if the branch didn't move since the head it read. The commit can't
  # use the workflow's own token, because GitHub starts no workflows for its pushes, so the new
  # head would wait for its required checks forever. It uses a short-lived token from Octo STS
  # instead, granted by renovate-upstream.sts.yaml in .github/chainguard/ of actions-fyi/.github,
  # which accepts released versions of this file, at refs/tags/v..., so callers call it by tag.
  # This repository's own caller runs a pull request's copy and gets no token; its configs extend
  # the upstream anyway.
  #
  # The run itself stays failed, because the commit it checked is missing the upstream; the fix
  # commit gets its own run. Renovate must list the commit's author, octo-sts[bot], in
  # gitIgnoredAuthors, or it stops updating the branch.
  fix:
    name: Fix Renovate Upstream
    needs: upstream
    if: >-
      !cancelled() && needs.upstream.outputs.missing != '' && needs.upstream.outputs.missing != '[]'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read the Renovate configs and the head commit
      id-token: write # Exchange the job's OIDC token with Octo STS
    env:
      # Marks the fix commit, so a fix that doesn't settle the configs isn't committed again.
      FIX_TRAILER: "Renovate-Upstream-Fixed-By: ${{ github.workflow }}"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      # Inserts the missing lines into the file's own text, so the rest keeps its formatting, and
      # checks that the result parses to the intended config. If it doesn't, the file is written
      # out again with two-space indentation.
      - name: Build Fix
        id: fix
        uses: actions/github-script@v9.0.0
        env:
          MISSING: ${{ needs.upstream.outputs.missing }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const missing = JSON.parse(process.env.MISSING);
            const { SCHEMA_URL: url, UPSTREAM: upstream, HEAD_SHA: ref, FIX_TRAILER: trailer } = process.env;
            const { data: head } = await github.rest.repos.getCommit({ ...context.repo, ref });
            if (head.commit.message.split('\n').includes(trailer)) {
              core.setFailed('The head commit is already a fix, but the configs still miss the upstream. Nothing was committed, to avoid a loop.');
              return;
            }
            const canonical = (v) => Array.isArray(v) ? v.map(canonical)
              : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, canonical(v[k])]))
              : v;
            // Inserts text right after the opening brace or bracket at index, in the indentation
            // of the next line, or inline when the next element is on the same line.
            const insertAfter = (text, index, entry) => {
              const rest = text.slice(index);
              const nextLine = rest.match(/^[ \t]*\r?\n([ \t]*)\S/);
              if (nextLine) return text.slice(0, index) + `\n${nextLine[1]}${entry},` + rest;
              const closing = /^\s*[\]}]/.test(rest);
              return text.slice(0, index) + (closing ? entry : `${entry}, `) + rest;
            };
            const additions = [];
            for (const { file, missing: keys } of missing) {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path: file, ref });
              // jq reads past a byte order mark, JSON.parse doesn't; the fix drops it.
              const original = Buffer.from(data.content, 'base64').toString('utf8').replace(/^\uFEFF/, '');
              const config = JSON.parse(original);
              const wanted = { ...config };
              if (keys.includes('$schema')) wanted.$schema = url;
              if (keys.includes('extends')) wanted.extends = [upstream, ...(config.extends ?? [])];
              let text = original;
              if (keys.includes('extends')) {
                const at = text.match(/"extends"\s*:\s*\[/);
                text = at
                  ? insertAfter(text, at.index + at[0].length, JSON.stringify(upstream))
                  : insertAfter(text, text.indexOf('{') + 1, `"extends": [${JSON.stringify(upstream)}]`);
              }
              if (keys.includes('$schema')) {
                text = /"\$schema"\s*:/.test(text)
                  ? text.replace(/("\$schema"\s*:\s*)"[^"]*"/, `$1${JSON.stringify(url)}`)
                  : insertAfter(text, text.indexOf('{') + 1, `"$schema": ${JSON.stringify(url)}`);
              }
              let same = false;
              try {
                same = JSON.stringify(canonical(JSON.parse(text))) === JSON.stringify(canonical(wanted));
              } catch {}
              if (!same) {
                core.warning(`Couldn't keep the formatting of ${file}, so it's written out again.`, { file });
                text = JSON.stringify({ ...(wanted.$schema ? { $schema: wanted.$schema } : {}), ...wanted }, null, 2) + '\n';
              }
              core.info(`${file}: adds ${keys.join(' and ')}`);
              additions.push({ path: file, contents: Buffer.from(text).toString('base64') });
            }
            core.setOutput('additions', JSON.stringify(additions));
      # The org scope loads the trust policies from the default branch of actions-fyi/.github, so a
      # pull request can't add or weaken them. The token is revoked when the job ends.
      - name: Get Fix Token
        if: steps.fix.outputs.additions != ''
        id: sts
        continue-on-error: true
        uses: step-security/octo-sts-action@v1.1.1
        with:
          scope: ${{ github.repository_owner }}
          identity: renovate-upstream
      - name: Report Missing Fix Token
        if: steps.fix.outputs.additions != '' && steps.sts.outcome != 'success'
        run: |
          echo "::error::Octo STS granted no token to commit the fix. Add the missing lines the Renovate Upstream job names and push."
          exit 1
      - name: Commit Fix
        if: steps.fix.outputs.additions != '' && steps.sts.outcome == 'success'
        uses: actions/github-script@v9.0.0
        env:
          ADDITIONS: ${{ steps.fix.outputs.additions }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ steps.sts.outputs.token }}
          script: |
            const { createCommitOnBranch: { commit } } = await github.graphql(`
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) { commit { oid } }
              }`, { input: {
                branch: { repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`, branchName: process.env.HEAD_REF },
                expectedHeadOid: process.env.HEAD_SHA,
                message: {
                  headline: 'chore(renovate): extend the org preset',
                  body: `Adds ${process.env.UPSTREAM} to extends, and the schema where it was missing.\n\n${process.env.FIX_TRAILER}`,
                },
                fileChanges: { additions: JSON.parse(process.env.ADDITIONS) },
              } });
            core.notice(`Committed the fix as ${commit.oid}.`);
