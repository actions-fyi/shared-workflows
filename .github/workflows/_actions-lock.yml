name: Validate Actions Lockfile
# A reusable workflow, not a ruleset workflow. It lives in actions-fyi/shared-workflows, which
# releases it under immutable tags, and holds the logic that used to be the ruleset workflow
# actions-lock.yml of actions-fyi/ruleset-workflows. Callers stay thin:
# - the org ruleset's entry point in actions-fyi/ruleset-workflows, for pull requests and merge
#   groups, and the push callers that actions-fyi/.github distributes, call it by full path and
#   tag. In a ruleset workflow, GitHub resolves `$/` against the target repository, where this
#   file doesn't exist.
# - this repository's own actions-lock.yml calls it with `uses: $/.github/workflows/_actions-lock.yml`.
# It runs as part of the caller's run, in the target repository's context: the caller's event,
# token and secrets. The caller's name is what a ruleset shows, so it must say what it checks, and
# it also names the fix commit's trailer (FIX_TRAILER below).
#
# The _ prefix marks a shared workflow: called only with workflow_call, never by events or rulesets.
#
# The calling job must grant the union of what the jobs below declare, or the call fails before
# anything runs:
#   contents: read        # changes, check, fix, commit
#   id-token: write       # commit: exchange the job's OIDC token with Octo STS
#
# Events:
# - pull_request and merge_group, from the ruleset or a caller. Rulesets ignore event filters and
#   only run on the default activity types (opened, synchronize and reopened for pull requests,
#   checks_requested for merge groups). A merge queue waits for every required workflow, so the
#   caller must also run on merge_group, where this verifies the merged result.
# - push: checks when the pushed commits change a workflow or action file, and checks everything
#   when the push creates the branch.
# Any other event checks too, because its changes can't be listed.
#
# Rulesets ignore paths filters too, and a required workflow that never runs would block merging.
# So the workflow always runs, and the changes job decides whether the pull request, merge group
# or push changes a workflow or action file, the lockfile included. If not, the check job and the
# jobs after it are skipped, and the run still succeeds, because the changes job does. On pull
# requests, a pin that stops verifying upstream is therefore reported by the next pull request that
# touches the workflows, not by unrelated ones. A missing lockfile is the exception: it is checked
# whatever the change, so the first pull request in a repository that has workflows adds it.
#
# Outside pull requests, the fix job stays skipped: a failed check only fails the run.
#
# The check job fails when .github/workflows/actions.lock is out of sync with the workflows, or a
# locked pin no longer verifies upstream. It also fails when the repository has workflows but no
# lockfile, so the fix job onboards the repository by adding one. That holds even when every
# workflow only calls reusable workflows, which the lockfile can't lock: GitHub refuses to start a
# workflow the lockfile doesn't list ("Workflow is not in the repository's lockfile"), so each one
# needs its entry, if only an empty one. Only a repository without workflows needs no lockfile, and
# is skipped.
#
# Findings of `gh actions-lock --verify` with severity warning don't fail the check, but each one
# becomes a warning annotation, and errors become error annotations. Some warnings still break
# runs: a bare-SHA `uses:` (sha-as-ref) whose lockfile entry is keyed by its tag fails at startup
# with "lockfile missing pin", because the runner matches the `uses:` text. That's why the fix job
# also runs after a passed check, in a repository with a lockfile.
#
# On a pull request from a branch of the same repository, the fix job runs gh actions-lock, and the
# commit job commits what it changes to the branch. That includes Renovate branches: Renovate updates the
# workflows but not the lockfile. It runs after a failed check, and after a passed one in a
# repository with a lockfile, where it fixes warnings such as a bare SHA, which it rewrites to its
# tag. A repository without a lockfile that passed has no workflows, so it gets no fix. A failed run
# stays failed, because the commit it checked is inconsistent; the fix commit gets its own run.
# Moved tags and unreachable pins are never fixed automatically, because they change which code
# runs. When gh actions-lock changes nothing, the fix job fails after a failed check, because a
# person has to act on it, and passes after a passed one: warnings it can't fix, such as a
# container image an action pulls by tag, stay annotations.
#
# The commit can't use the workflow's own token, because GitHub starts no workflows for its pushes,
# so the new head would wait for its required checks forever, and because that token can't change
# files under .github/workflows/. It uses a short-lived token from Octo STS instead, granted by an
# org-level trust policy in .github/chainguard/ of actions-fyi/.github. The commit job runs in this
# file, so the token's job_workflow_ref names this file, not the caller. Callers run a released
# version, at refs/tags/v..., which actions-lock.sts.yaml (identity actions-lock) matches. This
# repository's own caller runs the pull request's copy of this file, at refs/pull/<n>/merge, which
# only actions-lock.shared.sts.yaml (identity actions-lock.shared) matches. So the identity follows
# the caller, not the repository: in this repository, a ruleset caller still runs a released
# version. The commit job only requests the identity; the policy decides what's allowed. The policy
# must accept this file before a caller switches to it, or the commit job gets no token.
#
# The two jobs are split by trust. The fix job runs gh actions-lock, downloaded code, with a
# read-only token, and only stages what it changes. The commit job runs none of it: it checks the
# staged files against the commit they were made on, accepting only the lockfile and uses: lines,
# and only then gets the Octo STS token, which can write workflow files.
#
# A failed check on a pull request is explained by _explain.yml, which the consumer repository's
# workflow_run listener calls when this run completes. It reads the failed jobs' logs.
on:
  workflow_call:

permissions: {}

env:
  # renovate: datasource=github-releases depName=github/gh-actions-lock
  GH_ACTIONS_LOCK_VERSION: v0.5.0

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changed Workflows
    runs-on: ubuntu-24.04-firewall
    permissions:
      contents: read # Compare the changes against the base
    outputs:
      check: ${{ steps.changes.outputs.check }}
    steps:
      # A three-dot compare lists what the pull request changes since it branched off; for a merge
      # group, the base is an ancestor of the head, so it lists everything the group adds; for a
      # push, it lists what the pushed commits add since the merge base of before and after. The API
      # lists at most 300 files, and a larger or unlistable change is checked rather than guessed.
      # The paths are the ones the commit job may commit.
      #
      # A push that creates the branch has no before (all zeros), so it checks everything.
      #
      # Without a lockfile at the head, the check runs whatever changed: the check job then decides
      # whether the repository has workflows, and so needs one. Only a 404 counts as missing; any
      # other failure to read it leaves the decision to the changed files.
      - name: Find Changed Workflows
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after }}
        run: |
          check() {
            echo "::notice::$1"
            echo "check=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$GITHUB_EVENT_NAME" in
            push)
              [[ ! "$BASE_SHA" =~ ^0+$ ]] \
                || check "The push created the branch, so the lockfile is checked."
              ;;
          esac
          lockfile="$(gh api --include "repos/$GITHUB_REPOSITORY/contents/.github/workflows/actions.lock?ref=$HEAD_SHA" 2> /dev/null | head -n 1 || true)"
          [[ ! "$lockfile" =~ ^HTTP/[0-9.]+\ 404 ]] \
            || check "There is no .github/workflows/actions.lock, so the check decides whether one is needed."
          compare="$RUNNER_TEMP/compare.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" > "$compare" \
            || check "The changed files couldn't be listed, so the lockfile is checked."
          (( $(jq '.files // [] | length' "$compare") < 300 )) \
            || check "Too many changed files to list, so the lockfile is checked."
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/* | action.yml | action.yaml | */action.yml | */action.yaml)
                check "$path changed, so the lockfile is checked."
                ;;
            esac
          done < <(jq -r '.files // [] | .[] | .filename, (.previous_filename // empty)' "$compare")
          echo "::notice::No workflow or action file changed. Nothing to check."

  check:
    name: Actions Lockfile
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-24.04-firewall
    # Per caller: in a repository with two callers, its own and a ruleset's, neither cancels the other.
    concurrency:
      group: actions-lock-check-${{ github.workflow_ref }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read # Read the workflows
    outputs:
      # found, missing, or empty without workflows; read by the fix job after a passed check
      lockfile: ${{ steps.lockfile.outputs.state }}
    steps:
      # The pull request's head, not its merge commit, so the check and the fix see the same files.
      # The merge queue checks the merged result.
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Find Lockfile
        id: lockfile
        run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [[ -f .github/workflows/actions.lock ]]; then
            echo "state=found" >> "$GITHUB_OUTPUT"
          elif (( ${#workflows[@]} > 0 )); then
            echo "state=missing" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No workflows in .github/workflows, so there is nothing to lock."
          fi
      - name: Install gh-actions-lock
        if: steps.lockfile.outputs.state == 'found'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
      # --verify exits 0 as long as no finding is an error, and only prints warnings. So it runs
      # twice: once for the readable report and its exit code, which decides the step, and once with
      # --json for the findings. Both runs are read-only. Every finding of severity warning becomes a
      # warning annotation and every error an error annotation, so they show on the pull request.
      - name: Verify Lockfile
        if: steps.lockfile.outputs.state == 'found'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          gh actions-lock --verify || status=$?
          report="$RUNNER_TEMP/actions-lock-verify.json"
          gh actions-lock --verify --json=valid,findings > "$report" || true
          if ! jq -e '(.valid | type == "boolean") and (.findings | type == "array")' "$report" > /dev/null 2>&1; then
            echo "::warning::Couldn't read the findings of gh actions-lock --verify --json, so they have no annotations. See the output above."
            exit "$status"
          fi
          # The finding texts come from the workflow files, so they are escaped as workflow command
          # values: a newline in them must not start a command of its own.
          annotations='
            def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def property: data | gsub(":"; "%3A") | gsub(","; "%2C");
            .findings[]
            | select(.severity == "warning" or .severity == "error")
            | "::\(.severity) "
              + (if (.workflow // "") != "" then "file=\(.workflow | property)," else "" end)
              + "title=\("Actions lockfile: \(.category) (\(.severity))" | property)::"
              + ([
                  "workflow: \(if (.workflow // "") != "" then .workflow else "(repository)" end)",
                  "category: \(.category)",
                  "dependency: \(.dependency // "(none)")\(if .required_by then ", required by \(.required_by)" else "" end)",
                  "detail: \(.detail)",
                  "remediation: \(.remediation // "none given")"
                ] | join("\n") | data)'
          jq -r "$annotations" "$report"
          if (( status != 0 )) || [[ "$(jq -r .valid "$report")" != true ]]; then
            echo "::error::gh actions-lock --verify failed. See the output above."
            exit 1
          fi
      # Fails whatever the workflows use: GitHub starts no workflow the lockfile doesn't list, and
      # one that only calls reusable workflows still needs its empty entry. See the top.
      - name: Report Missing Lockfile
        if: steps.lockfile.outputs.state == 'missing'
        run: |
          echo "::error::No .github/workflows/actions.lock, although the repository has workflows. GitHub refuses to start a workflow that isn't in the lockfile. On a pull request from a branch of this repository, the fix job adds it; otherwise run gh actions-lock and commit the result."
          exit 1

  fix:
    name: Fix Actions Lockfile
    needs: check
    # After every check that ran on a pull request from a branch of this repository, failed or
    # passed, because a passed check can still report warnings gh actions-lock fixes. After a
    # passed check, only if the repository has a lockfile: one without it passed because it has no
    # workflows, so there is nothing to lock. Fork pull requests
    # get no OIDC token, the merge queue has no branch to fix, and Dependabot updates the lockfile
    # itself.
    #
    # This job runs gh actions-lock, which is downloaded code, so it gets no token that can write:
    # it only stages the files the fix changes and uploads them. The commit job checks them and
    # commits them with the Octo STS token, which is never issued in a job that ran gh actions-lock.
    # A process an earlier step leaves running lives until its job ends, so the token would
    # otherwise be readable by whatever gh actions-lock started.
    if: >-
      !cancelled()
      && (
        needs.check.result == 'failure'
        || (needs.check.result == 'success' && needs.check.outputs.lockfile == 'found')
      )
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04-firewall
    permissions:
      contents: read # Read the workflows
    env:
      # Marks the fix commit, so a fix that doesn't settle the lockfile isn't committed again.
      FIX_TRAILER: "Lockfile-Fixed-By: ${{ github.workflow }}"
      # success or failure: whether a fix run that changes nothing, or can't run, fails this job.
      CHECK_RESULT: ${{ needs.check.result }}
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      changed: ${{ steps.fix.outputs.changed }}
    steps:
      # The branch's head now, because the fix is committed on top of it. It differs from the
      # commit the check ran on when something was pushed, or another fix job committed, since.
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      # moved: the check's result is about another commit, so a fix that finds nothing to do here,
      # or can't run, doesn't fail this job. The new head gets its own run.
      - name: Find Head
        id: head
        env:
          CHECKED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$sha" != "$CHECKED_SHA" ]]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The branch moved from $CHECKED_SHA, which the check ran on, to $sha. The fix is tried on $sha."
          fi
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
      # A fix run performs the same checks as --verify, and writes nothing when one of them fails,
      # so moved tags and unreachable pins still need a person. After a passed check, such a
      # failure only leaves the warnings as they are, so it doesn't fail the job.
      - name: Regenerate Lockfile
        id: regenerate
        env:
          GH_TOKEN: ${{ github.token }}
          MOVED: ${{ steps.head.outputs.moved }}
        run: |
          if gh actions-lock; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          elif [[ "$MOVED" == true ]]; then
            echo "::warning::gh actions-lock couldn't fix the branch's new head; see the output above. Nothing was committed, and the new head's own run reports it."
          elif [[ "$CHECK_RESULT" == success ]]; then
            echo "::warning::gh actions-lock couldn't fix the warnings of the check job; see the output above. Nothing was committed."
          else
            exit 1
          fi
      # Stages each changed file under files/, at its path, and lists the changes in changes.json.
      # The commit job checks them again: nothing here is trusted, because gh actions-lock ran here.
      - name: Collect Fix
        id: fix
        if: steps.regenerate.outputs.done == 'true'
        env:
          MOVED: ${{ steps.head.outputs.moved }}
          STAGING: ${{ runner.temp }}/actions-lock-fix
        run: |
          git add --all
          mapfile -d '' changed < <(git diff --cached --no-renames --name-only -z)
          if (( ${#changed[@]} == 0 )); then
            if [[ "$MOVED" == true ]]; then
              echo "::notice::gh actions-lock changes nothing on the branch's new head, so the lockfile was already fixed there and there is nothing to commit."
              exit 0
            fi
            if [[ "$CHECK_RESULT" == success ]]; then
              echo "::notice::gh actions-lock changed nothing, so there is nothing to commit. Any warnings the check job annotated are ones it doesn't fix."
              exit 0
            fi
            echo "::error::gh actions-lock changed nothing, although the check failed, so it can't fix these findings and a person has to. The check job's annotations list each finding with its remediation."
            exit 1
          fi
          git diff --cached
          if grep -qxF "$FIX_TRAILER" <<< "$(git log -1 --format=%B)"; then
            echo "::error::The head commit is already a lockfile fix, but gh actions-lock still changes files. Nothing was committed, to avoid a loop."
            exit 1
          fi
          mapfile -d '' additions < <(git diff --cached --no-renames --name-only -z --diff-filter=d)
          mapfile -d '' deletions < <(git diff --cached --no-renames --name-only -z --diff-filter=D)
          mkdir -p "$STAGING/files"
          for path in "${additions[@]}"; do
            mkdir -p "$STAGING/files/$(dirname -- "$path")"
            cp -- "$path" "$STAGING/files/$path"
          done
          jq -n \
            --argjson additions "$(jq -n '$ARGS.positional' --args "${additions[@]}")" \
            --argjson deletions "$(jq -n '$ARGS.positional' --args "${deletions[@]}")" \
            '{additions: $additions, deletions: $deletions}' > "$STAGING/changes.json"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Save Fix
        if: steps.fix.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: actions-lock-fix
          path: ${{ runner.temp }}/actions-lock-fix
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  commit:
    name: Commit Actions Lockfile Fix
    needs: fix
    if: needs.fix.result == 'success' && needs.fix.outputs.changed == 'true'
    runs-on: ubuntu-24.04-firewall
    # One group for every job that commits to a pull request's branch, in any workflow, so only one
    # of them runs at a time per pull request. queue: max lets the others wait their turn instead
    # of replacing each other; it can't be combined with cancel-in-progress. If another one
    # committed while this one waited, the commit below fails on expectedHeadOid, and the new head
    # gets its own run.
    concurrency:
      group: pr-write-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      contents: read # Check out the commit the fix was made on, to compare the fix with it
      id-token: write # Exchange the job's OIDC token with Octo STS
    env:
      FIX_TRAILER: "Lockfile-Fixed-By: ${{ github.workflow }}"
    # Only actions of GitHub and Octo STS, and shell, run here: nothing the fix job ran.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.fix.outputs.sha }}
          persist-credentials: false
      - name: Download Fix
        uses: actions/download-artifact@v8.0.2
        with:
          name: actions-lock-fix
          path: ${{ runner.temp }}/actions-lock-fix
      # Accepts only what gh actions-lock changes: the lockfile, and the uses: lines of workflow and
      # action files, which it narrows to a full tag or rewrites from ./ to $/. Every other change
      # to a workflow or action file, a new one, or a deletion fails here, and nothing is committed.
      # The lockfile's pins aren't checked here; the check job of the fix commit's own run verifies
      # them against GitHub.
      - name: Check Fix
        env:
          STAGING: ${{ runner.temp }}/actions-lock-fix
        run: |
          set -o noglob
          fail() { echo "::error::$1 Nothing was committed; run gh actions-lock and push the result."; exit 1; }
          changes="$STAGING/changes.json"
          jq -e '(.additions | type == "array") and (.deletions | type == "array")
            and all(.additions[], .deletions[]; type == "string")' "$changes" > /dev/null \
            || fail "The fix's changes.json doesn't list its additions and deletions."
          [[ $(jq '.deletions | length' "$changes") == 0 ]] || fail "The fix deletes files, which gh actions-lock doesn't."
          mapfile -t additions < <(jq -r '.additions[]' "$changes")
          (( ${#additions[@]} > 0 )) || fail "The fix lists no changes."
          uses='^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[^[:space:]]'
          for path in "${additions[@]}"; do
            case "$path" in
              /* | *..* | *//* | *$'\n'* | '') fail "The fix lists $path, which isn't a path in the repository." ;;
            esac
            staged="$STAGING/files/$path"
            [[ -f "$staged" && ! -L "$staged" ]] || fail "The fix lists $path, but didn't stage it as a file."
            case "$path" in
              .github/workflows/actions.lock) continue ;;
              .github/workflows/*.yml | .github/workflows/*.yaml | action.yml | action.yaml | */action.yml | */action.yaml) ;;
              *) fail "The fix changes $path, which is neither the lockfile nor a workflow or action file." ;;
            esac
            [[ -f "$path" && ! -L "$path" ]] || fail "The fix adds $path, which gh actions-lock doesn't."
            mapfile -t before < "$path"
            mapfile -t after < "$staged"
            (( ${#before[@]} == ${#after[@]} )) || fail "The fix adds or removes lines in $path, which gh actions-lock doesn't."
            for i in "${!before[@]}"; do
              [[ "${before[i]}" == "${after[i]}" ]] && continue
              line="line $((i + 1)) of $path"
              [[ "${before[i]}" =~ $uses && "${after[i]}" =~ $uses ]] || fail "The fix changes $line, which isn't a uses: line."
              # The text before the value, and after it (a comment), stays as it is; only the
              # value changes, in one of the two ways gh actions-lock changes it.
              [[ "${before[i]%%uses:*}" == "${after[i]%%uses:*}" ]] || fail "The fix moves the uses: key on $line."
              read -r old old_rest <<< "${before[i]#*uses:}"
              read -r new new_rest <<< "${after[i]#*uses:}"
              [[ "$old_rest" == "$new_rest" ]] || fail "The fix changes more than the action reference on $line."
              if [[ "$old" == ./* && "$new" == "\$/${old#./}" ]]; then
                continue # ./path to $/path: the same action in this repository, at the running commit
              fi
              [[ "$old" == *@* && "$new" == *@* && "${old%@*}" == "${new%@*}" ]] \
                || fail "The fix changes the action on $line from $old to $new; gh actions-lock only changes its version."
              # A partial version narrowed to a full one (v6 to v6.1.0), or a bare commit SHA
              # rewritten to its tag. The lockfile pins the commit either way, and the fix commit's
              # own check verifies the pin against the tag.
              [[ "${new##*@}" == "${old##*@}".* || "${old##*@}" =~ ^[0-9a-f]{40}$ ]] \
                || fail "The fix changes the action on $line from $old to $new; gh actions-lock only narrows a version or rewrites ./ to \$/."
            done
          done
          echo "::notice::The fix changes ${#additions[@]} file(s), all of them the lockfile or uses: lines."
      # The org scope loads the trust policies from the default branch of actions-fyi/.github, so a
      # pull request can't add or weaken them. The token is revoked when the job ends.
      #
      # actions-lock.sts.yaml accepts only released versions of this file, at refs/tags/v...; this
      # repository's own caller runs the pull request's copy, at refs/pull/<n>/merge, and requests
      # actions-lock.shared. github.workflow_ref names the caller.
      - name: Get Fix Token
        id: sts
        continue-on-error: true
        uses: octo-sts/action@v1.1.1
        with:
          scope: ${{ github.repository_owner }}
          identity: ${{ startsWith(github.workflow_ref, 'actions-fyi/shared-workflows/') && 'actions-lock.shared' || 'actions-lock' }}
      - name: Report Missing Fix Token
        if: steps.sts.outcome != 'success'
        run: |
          echo "::error::Octo STS granted no token to commit the fix. Run gh actions-lock and push the result."
          exit 1
      # Committed through the API rather than pushed, so GitHub signs the commit, and the branch
      # only moves if nothing was pushed to it since the fix job checked it out. Renovate must list
      # the commit's author, octo-sts[bot], in gitIgnoredAuthors, or it stops updating the branch.
      - name: Commit Fix
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ needs.fix.outputs.sha }}
          STAGING: ${{ runner.temp }}/actions-lock-fix
        run: |
          additions="$RUNNER_TEMP/additions.json"
          request="$RUNNER_TEMP/request.json"
          jq -r '.additions[]' "$STAGING/changes.json" \
            | while IFS= read -r path; do
                jq -n --arg path "$path" --rawfile contents <(base64 -w0 -- "$STAGING/files/$path") \
                  '{path: $path, contents: $contents}'
              done \
            | jq -s . > "$additions"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$HEAD_REF" \
            --arg head "$HEAD_SHA" \
            --arg body "Regenerated with gh actions-lock, so the lockfile and the workflows agree.

          $FIX_TRAILER" \
            --slurpfile additions "$additions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "ci: update the actions lockfile", body: $body},
                fileChanges: {additions: $additions[0], deletions: []}
              }}
            }' > "$request"
          if ! oid=$(gh api graphql --input "$request" --jq '.data.createCommitOnBranch.commit.oid'); then
            echo "::error::Couldn't commit the lockfile fix. If the branch moved since the fix job checked it out, the new push gets its own run."
            exit 1
          fi
          echo "::notice::Committed the lockfile fix as $oid. Its own run checks the result."
