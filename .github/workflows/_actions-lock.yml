name: Check Actions Lockfile
# A reusable workflow, not a ruleset workflow. It lives in actions-fyi/shared-workflows, which
# releases it under immutable tags, and holds the logic that used to be the ruleset workflow
# actions-lock.yml of actions-fyi/ruleset-workflows. Callers stay thin:
# - the org ruleset's entry point in actions-fyi/ruleset-workflows, for pull requests and merge
#   groups, and the push callers that actions-fyi/.github distributes, call it by full path and
#   tag. In a ruleset workflow, GitHub resolves `$/` against the target repository, where this
#   file doesn't exist.
# - this repository's own actions-lock.yml calls it with `uses: $/.github/workflows/_actions-lock.yml`.
# It runs as part of the caller's run, in the target repository's context: the caller's event,
# token and secrets. The caller's name is what a ruleset shows, so it must say what it checks, and
# it also names the fix commit's trailer (FIX_TRAILER below).
#
# The _ prefix marks a shared workflow: called only with workflow_call, never by events or rulesets.
#
# The calling job must grant the union of what the jobs below declare, or the call fails before
# anything runs:
#   contents: read        # changes, check, fix
#   id-token: write       # fix: exchange the job's OIDC token with Octo STS
#
# Events:
# - pull_request and merge_group, from the ruleset or a caller. Rulesets ignore event filters and
#   only run on the default activity types (opened, synchronize and reopened for pull requests,
#   checks_requested for merge groups). A merge queue waits for every required workflow, so the
#   caller must also run on merge_group, where this verifies the merged result.
# - push: checks when the pushed commits change a workflow or action file, and checks everything
#   when the push creates the branch.
# Any other event checks too, because its changes can't be listed.
#
# Rulesets ignore paths filters too, and a required workflow that never runs would block merging.
# So the workflow always runs, and the changes job decides whether the pull request, merge group
# or push changes a workflow or action file, the lockfile included. If not, the check job and the
# jobs after it are skipped, and the run still succeeds, because the changes job does. On pull
# requests, a pin that stops verifying upstream is therefore reported by the next pull request that
# touches the workflows, not by unrelated ones.
#
# Outside pull requests, the fix job stays skipped: a failed check only fails the run.
#
# The check job fails when .github/workflows/actions.lock is out of sync with the workflows, or a
# locked pin no longer verifies upstream. It also fails when there is no lockfile although the
# workflows use an action it would lock, so the fix job onboards the repository by adding one. A
# repository whose workflows only call reusable workflows, which the lockfile can't lock, needs
# none, and is skipped; so is one without workflows.
#
# Findings of `gh actions-lock --verify` with severity warning don't fail the check, but each one
# becomes a warning annotation, and errors become error annotations. Some warnings still break
# runs: a bare-SHA `uses:` (sha-as-ref) whose lockfile entry is keyed by its tag fails at startup
# with "lockfile missing pin", because the runner matches the `uses:` text. That's why the fix job
# also runs after a passed check, in a repository with a lockfile.
#
# On a pull request from a branch of the same repository, the fix job runs gh actions-lock and
# commits whatever it changes to the branch. That includes Renovate branches: Renovate updates the
# workflows but not the lockfile. It runs after a failed check, and after a passed one in a
# repository with a lockfile, where it fixes warnings such as a bare SHA, which it rewrites to its
# tag. A repository without a lockfile that passed needs none, so it gets no fix. A failed run
# stays failed, because the commit it checked is inconsistent; the fix commit gets its own run.
# Moved tags and unreachable pins are never fixed automatically, because they change which code
# runs. When gh actions-lock changes nothing, the fix job fails after a failed check, because a
# person has to act on it, and passes after a passed one: warnings it can't fix, such as a
# container image an action pulls by tag, stay annotations.
#
# The commit can't use the workflow's own token, because GitHub starts no workflows for its pushes,
# so the new head would wait for its required checks forever, and because that token can't change
# files under .github/workflows/. It uses a short-lived token from Octo STS instead, granted by an
# org-level trust policy in .github/chainguard/ of actions-fyi/.github. The fix job runs in this
# file, so the token's job_workflow_ref names this file, not the caller. Callers run a released
# version, at refs/tags/v..., which actions-lock.sts.yaml (identity actions-lock) matches. This
# repository's own caller runs the pull request's copy of this file, at refs/pull/<n>/merge, which
# only actions-lock.shared.sts.yaml (identity actions-lock.shared) matches. So the identity follows
# the caller, not the repository: in this repository, a ruleset caller still runs a released
# version. The fix job only requests the identity; the policy decides what's allowed. The policy must accept this
# file before a caller switches to it, or the fix job gets no token.
#
# A failed check on a pull request is explained by _explain.yml, which the consumer repository's
# workflow_run listener calls when this run completes. It reads the failed jobs' logs.
on:
  workflow_call:

permissions: {}

env:
  # renovate: datasource=github-releases depName=github/gh-actions-lock
  GH_ACTIONS_LOCK_VERSION: v0.4.1

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changed Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read # Compare the changes against the base
    outputs:
      check: ${{ steps.changes.outputs.check }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      # A three-dot compare lists what the pull request changes since it branched off; for a merge
      # group, the base is an ancestor of the head, so it lists everything the group adds; for a
      # push, it lists what the pushed commits add since the merge base of before and after. The API
      # lists at most 300 files, and a larger or unlistable change is checked rather than guessed.
      # The paths are the ones the fix job may commit.
      #
      # A push that creates the branch has no before (all zeros), so it checks everything.
      - name: Find Changed Workflows
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after }}
        run: |
          check() {
            echo "::notice::$1"
            echo "check=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$GITHUB_EVENT_NAME" in
            push)
              [[ ! "$BASE_SHA" =~ ^0+$ ]] \
                || check "The push created the branch, so the lockfile is checked."
              ;;
          esac
          compare="$RUNNER_TEMP/compare.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" > "$compare" \
            || check "The changed files couldn't be listed, so the lockfile is checked."
          (( $(jq '.files // [] | length' "$compare") < 300 )) \
            || check "Too many changed files to list, so the lockfile is checked."
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/* | action.yml | action.yaml | */action.yml | */action.yaml)
                check "$path changed, so the lockfile is checked."
                ;;
            esac
          done < <(jq -r '.files // [] | .[] | .filename, (.previous_filename // empty)' "$compare")
          echo "::notice::No workflow or action file changed. Nothing to check."

  check:
    name: Actions Lockfile
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    # Per caller: in a repository with two callers, its own and a ruleset's, neither cancels the other.
    concurrency:
      group: actions-lock-check-${{ github.workflow_ref }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read # Read the workflows
    outputs:
      # found, missing, or empty without .github/workflows; read by the fix job after a passed check
      lockfile: ${{ steps.lockfile.outputs.state }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      # The pull request's head, not its merge commit, so the check and the fix see the same files.
      # The merge queue checks the merged result.
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Find Lockfile
        id: lockfile
        run: |
          if [[ -f .github/workflows/actions.lock ]]; then
            echo "state=found" >> "$GITHUB_OUTPUT"
          elif [[ -d .github/workflows ]]; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No .github/workflows, so there is nothing to lock."
          fi
      - name: Install gh-actions-lock
        if: steps.lockfile.outputs.state != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
      # --verify exits 0 as long as no finding is an error, and only prints warnings. So it runs
      # twice: once for the readable report and its exit code, which decides the step, and once with
      # --json for the findings. Both runs are read-only. Every finding of severity warning becomes a
      # warning annotation and every error an error annotation, so they show on the pull request.
      - name: Verify Lockfile
        if: steps.lockfile.outputs.state == 'found'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          gh actions-lock --verify || status=$?
          report="$RUNNER_TEMP/actions-lock-verify.json"
          gh actions-lock --verify --json=valid,findings > "$report" || true
          if ! jq -e '(.valid | type == "boolean") and (.findings | type == "array")' "$report" > /dev/null 2>&1; then
            echo "::warning::Couldn't read the findings of gh actions-lock --verify --json, so they have no annotations. See the output above."
            exit "$status"
          fi
          # The finding texts come from the workflow files, so they are escaped as workflow command
          # values: a newline in them must not start a command of its own.
          annotations='
            def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def property: data | gsub(":"; "%3A") | gsub(","; "%2C");
            .findings[]
            | select(.severity == "warning" or .severity == "error")
            | "::\(.severity) "
              + (if (.workflow // "") != "" then "file=\(.workflow | property)," else "" end)
              + "title=\("Actions lockfile: \(.category) (\(.severity))" | property)::"
              + ([
                  "workflow: \(if (.workflow // "") != "" then .workflow else "(repository)" end)",
                  "category: \(.category)",
                  "dependency: \(.dependency // "(none)")\(if .required_by then ", required by \(.required_by)" else "" end)",
                  "detail: \(.detail)",
                  "remediation: \(.remediation // "none given")"
                ] | join("\n") | data)'
          jq -r "$annotations" "$report"
          if (( status != 0 )) || [[ "$(jq -r .valid "$report")" != true ]]; then
            echo "::error::gh actions-lock --verify failed. See the output above."
            exit 1
          fi
      # Generates the lockfile the repository would need, only to see whether it locks anything:
      # without a dependencies key, every workflow only calls reusable workflows. Nothing is kept.
      - name: Check Missing Lockfile
        if: steps.lockfile.outputs.state == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh actions-lock
          if grep -q '^dependencies:' .github/workflows/actions.lock; then
            echo "::error::No .github/workflows/actions.lock, although the workflows use actions. On a pull request from a branch of this repository, the fix job adds it."
            exit 1
          fi
          echo "::notice::No .github/workflows/actions.lock, and the workflows use no action it would lock, so none is needed."

  fix:
    name: Fix Actions Lockfile
    needs: check
    # After every check that ran on a pull request from a branch of this repository, failed or
    # passed, because a passed check can still report warnings gh actions-lock fixes. After a
    # passed check, only if the repository has a lockfile: one without it passed because it needs
    # none, and gh actions-lock would only add a lockfile without dependencies. Fork pull requests
    # get no OIDC token, the merge queue has no branch to fix, and Dependabot updates the lockfile
    # itself.
    #
    # No concurrency group: the commit only lands if the branch didn't move, and a group shared
    # with the check job would let the run that the fix commit starts cancel this job's cleanup.
    if: >-
      !cancelled()
      && (
        needs.check.result == 'failure'
        || (needs.check.result == 'success' && needs.check.outputs.lockfile == 'found')
      )
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read the workflows
      id-token: write # Exchange the job's OIDC token with Octo STS
    env:
      # Marks the fix commit, so a fix that doesn't settle the lockfile isn't committed again.
      FIX_TRAILER: "Lockfile-Fixed-By: ${{ github.workflow }}"
      # success or failure: whether a fix run that changes nothing, or can't run, fails this job.
      CHECK_RESULT: ${{ needs.check.result }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      # The pull request's head, because the fix is committed on top of it.
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
      # A fix run performs the same checks as --verify, and writes nothing when one of them fails,
      # so moved tags and unreachable pins still need a person. After a passed check, such a
      # failure only leaves the warnings as they are, so it doesn't fail the job.
      - name: Regenerate Lockfile
        id: regenerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh actions-lock; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          elif [[ "$CHECK_RESULT" == success ]]; then
            echo "::warning::gh actions-lock couldn't fix the warnings of the check job; see the output above. Nothing was committed."
          else
            exit 1
          fi
      - name: Collect Fix
        id: fix
        if: steps.regenerate.outputs.done == 'true'
        run: |
          git add --all
          mapfile -d '' changed < <(git diff --cached --no-renames --name-only -z)
          if (( ${#changed[@]} == 0 )); then
            if [[ "$CHECK_RESULT" == success ]]; then
              echo "::notice::gh actions-lock changed nothing, so there is nothing to commit. Any warnings the check job annotated are ones it doesn't fix."
              exit 0
            fi
            echo "::error::gh actions-lock changed nothing, although the check failed, so it can't fix these findings and a person has to. The check job's annotations list each finding with its remediation."
            exit 1
          fi
          git diff --cached
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/* | action.yml | action.yaml | */action.yml | */action.yaml) ;;
              *)
                echo "::error::gh actions-lock changed $path, which isn't a workflow or action file. Nothing was committed."
                exit 1
                ;;
            esac
          done
          if grep -qxF "$FIX_TRAILER" <<< "$(git log -1 --format=%B)"; then
            echo "::error::The head commit is already a lockfile fix, but gh actions-lock still changes files. Nothing was committed, to avoid a loop."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # The org scope loads the trust policies from the default branch of actions-fyi/.github, so a
      # pull request can't add or weaken them. The token is revoked when the job ends.
      #
      # actions-lock.sts.yaml accepts only released versions of this file, at refs/tags/v...; this
      # repository's own caller runs the pull request's copy, at refs/pull/<n>/merge, and requests
      # actions-lock.shared. github.workflow_ref names the caller.
      - name: Get Fix Token
        if: steps.fix.outputs.changed == 'true'
        id: sts
        continue-on-error: true
        uses: step-security/octo-sts-action@v1.1.1
        with:
          scope: ${{ github.repository_owner }}
          identity: ${{ startsWith(github.workflow_ref, 'actions-fyi/shared-workflows/') && 'actions-lock.shared' || 'actions-lock' }}
      - name: Report Missing Fix Token
        if: steps.fix.outputs.changed == 'true' && steps.sts.outcome != 'success'
        run: |
          echo "::error::Octo STS granted no token to commit the fix. Run gh actions-lock and push the result."
          exit 1
      # Committed through the API rather than pushed, so GitHub signs the commit, and the branch
      # only moves if nothing was pushed to it since this run started. Renovate must list the
      # commit's author, octo-sts[bot], in gitIgnoredAuthors, or it stops updating the branch.
      - name: Commit Fix
        if: steps.fix.outputs.changed == 'true' && steps.sts.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          additions="$RUNNER_TEMP/additions.json"
          deletions="$RUNNER_TEMP/deletions.json"
          request="$RUNNER_TEMP/request.json"
          git diff --cached --no-renames --name-only -z --diff-filter=d \
            | while IFS= read -r -d '' path; do
                jq -n --arg path "$path" --rawfile contents <(base64 -w0 -- "$path") \
                  '{path: $path, contents: $contents}'
              done \
            | jq -s . > "$additions"
          git diff --cached --no-renames --name-only -z --diff-filter=D \
            | while IFS= read -r -d '' path; do
                jq -n --arg path "$path" '{path: $path}'
              done \
            | jq -s . > "$deletions"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$HEAD_REF" \
            --arg head "$HEAD_SHA" \
            --arg body "Regenerated with gh actions-lock, so the lockfile and the workflows agree.

          $FIX_TRAILER" \
            --slurpfile additions "$additions" \
            --slurpfile deletions "$deletions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "ci: update the actions lockfile", body: $body},
                fileChanges: {additions: $additions[0], deletions: $deletions[0]}
              }}
            }' > "$request"
          if ! oid=$(gh api graphql --input "$request" --jq '.data.createCommitOnBranch.commit.oid'); then
            echo "::error::Couldn't commit the lockfile fix. If the branch moved since this run started, the new push gets its own run."
            exit 1
          fi
          echo "::notice::Committed the lockfile fix as $oid. Its own run checks the result."
