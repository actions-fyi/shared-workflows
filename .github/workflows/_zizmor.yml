name: Audit
# A reusable workflow, not a ruleset workflow. It lives in actions-fyi/shared-workflows, which
# releases it under immutable tags, and holds the zizmor audit that used to be zizmor.yml of
# actions-fyi/.github. Workflows in other repositories, ruleset workflows included, call it by full
# path and tag: in a ruleset workflow, GitHub resolves `$/` against the target repository, where
# this file doesn't exist. This repository's own zizmor.yml calls it with
# `uses: $/.github/workflows/_zizmor.yml`.
# It runs as part of the caller's run, in the target repository's context: the caller's event,
# token and secrets.
#
# The _ prefix marks a shared workflow: called only with workflow_call, never by events or rulesets.
#
# The calling job must grant what the zizmor job declares, or the call fails before anything runs:
#   security-events: write  # upload the SARIF results to code scanning
#   contents: read          # check out the repository
#   actions: read           # let upload-sarif read the workflow run
#
# Known caveat: code scanning keys an analysis on the workflow path and the job, and those come
# from the caller. When pull requests run through one caller (e.g. the org ruleset's) and pushes
# to the default branch through another (e.g. the push caller from actions-fyi/.github), the two
# analyses don't match, and pull requests can show "no analysis on the base branch". Where
# possible, callers use the same file name, zizmor.yml, and the same job id, zizmor.
on:
  workflow_call:
    inputs:
      zizmor-version:
        description: >-
          The zizmor version to run instead of ZIZMOR_VERSION below, e.g. 1.31.0. zizmor-action
          must ship a lock for it. Renovate doesn't update it.
        type: string
        required: false
        default: ""

permissions: {}

# zizmor-action only installs the versions it ships a hash-pinned lock for, so a new zizmor
# release may need a newer zizmor-action first. Renovate groups the two in one pull request.
env:
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.31.1

jobs:
  zizmor:
    name: CI Config
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
      contents: read         # Only needed for private repos. Needed to clone the repo.
      actions: read          # Only needed for private repos. Needed for upload-sarif to read workflow run info.
    concurrency:
      group: zizmor-${{ github.ref }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Any ref is accepted, as long as it is one. Actions are pinned by actions.lock, which the org
      # ruleset's lockfile check adds to every repository whose workflows use an action, and a
      # workflow using an action it doesn't list fails at startup; composite actions are locked
      # with the actions they call. The lockfile can't
      # lock reusable workflows, but only actions-fyi's are used, and those may be called by tag:
      # the OpenBao and Octo STS trust policies bind the tag ref, which a commit SHA doesn't match.
      # zizmor's patterns match a repository, not whether it's called as an action or a workflow,
      # so a third-party reusable workflow called by tag or branch passes too. That gap is accepted.
      # zizmor before 1.32 doesn't read the lockfile, so hash-pin would flag every action by tag.
      #
      # dangerous-triggers flags every workflow_run and issue_comment trigger. The org's callers
      # of _explain.yml, _pr-metadata.yml and _claude.yml need them: they run after a pull
      # request's checks, or on a comment, with the base branch's workflow and token. Their files,
      # synced from actions-fyi/.github, are exempt by name; every other workflow is still audited.
      # The match is by file name only, so a repository's own workflow under one of these names is
      # exempt too, with any trigger in it. That gap is accepted.
      - name: Write zizmor Config
        id: config
        run: |
          config="$RUNNER_TEMP/zizmor.yml"
          cat > "$config" <<'EOF'
          rules:
            unpinned-uses:
              config:
                policies:
                  "*": ref-pin
            dangerous-triggers:
              ignore:
                - actions-lock-explain.yml
                - claude.yml
                - pr-metadata.yml
          EOF
          echo "path=$config" >> "$GITHUB_OUTPUT"
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: ${{ inputs.zizmor-version || env.ZIZMOR_VERSION }}
          config: ${{ steps.config.outputs.path }}
          persona: pedantic
          min-severity: low
          min-confidence: medium
