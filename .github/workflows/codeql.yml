name: CodeQL
# This repository's caller of its own shared workflow _codeql.yml, which holds the analysis; see
# there. It calls the sibling with `$/`, so a pull request runs its own version of it. The org
# ruleset doesn't run in this repository, so this caller covers its pull requests and merge groups
# too, and pushes to main and a weekly run give code scanning the default branch's results.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

# A newer push to a pull request cancels the analysis of the previous one, which would otherwise
# hold its runners to the end. Every other run gets a group of its own, so the analysis of a merge
# group, a push to main or the weekly run is never cancelled or held back.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    # Not in a fork: a fork that wants CodeQL turns on its default setup, which this workflow's
    # upload would conflict with, and posting CodeQL Results needs Octo STS, which trusts only the
    # org's repositories.
    if: github.repository_owner == 'actions-fyi'
    # The union of what the jobs of _codeql.yml declare; a called job can't get more.
    permissions:
      contents: read # Read the repository's languages and check it out
      security-events: write # Upload the results to code scanning
      actions: read # Let CodeQL read the workflow run
      id-token: write # Exchange an OIDC token with Octo STS to post CodeQL Results
    uses: $/.github/workflows/_codeql.yml
