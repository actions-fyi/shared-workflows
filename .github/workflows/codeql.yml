name: CodeQL
# This repository's caller of its own shared workflow _codeql.yml, which holds the analysis; see
# there. It calls the sibling with `$/`, so a pull request runs its own version of it. The org
# ruleset doesn't run in this repository, so this caller covers its pull requests and merge groups
# too, and pushes to main and a weekly run give code scanning the default branch's results.
#
# The repository's own ruleset requires "CodeQL / Upload (actions)", its only CodeQL language.
# Otherwise the merge queue merges and deletes its branch before the upload, and code scanning
# rejects the results for a ref that no longer exists. The org ruleset needs no such check: a
# ruleset workflow is required as a whole run, uploads included.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

jobs:
  codeql:
    name: CodeQL
    # The union of what the jobs of _codeql.yml declare; a called job can't get more.
    permissions:
      contents: read # Read the repository's languages and check it out
      security-events: write # Upload the results to code scanning
      actions: read # Let CodeQL read the workflow run
    uses: $/.github/workflows/_codeql.yml
