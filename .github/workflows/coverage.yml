name: Report Coverage
# This repository's caller of its own shared workflow _coverage.yml, which holds the reporting; see
# there. A workflow_run listener runs from the default branch only, so a pull request that changes
# _coverage.yml isn't tested by it: the change runs once it's merged.
#
# A workflow_run trigger matches workflows by name, not by file. Test is typescript.yml of
# actions-fyi/.github, on pushes to the default branch, and this repository's own typescript.yml.
# Test TypeScript is the org ruleset workflow, on pull requests. The check of another language
# joins the list under its own name; nothing else changes for it.
#
# This repository's custom property coverage-providers is empty, so nothing is reported here.
on:
  workflow_run:
    workflows: ["Test", "Test TypeScript"]
    types: [completed]

permissions: {}

jobs:
  coverage:
    name: Coverage
    # Not in a fork: the coverage providers are the org's, and a fork names none.
    if: github.repository_owner == 'actions-fyi'
    cache-mode: none
    # The union of what the jobs of _coverage.yml declare; a called job can't get more.
    permissions:
      actions: read # List the run's artifacts and download the coverage reports
      contents: read # Let the egress firewall read its policy
      pull-requests: read # Find the pull request of the run
      code-quality: write # Upload the coverage reports to GitHub Code Quality
      id-token: write # Exchange the job's OIDC token with DeepSource
    uses: $/.github/workflows/_coverage.yml
