name: Check Workflow Data Flow
# This repository's caller of its own shared workflow _flowpact.yml, which holds the lint; see
# there. It calls the sibling with `$/`, so a pull request runs its own version of it. The org
# ruleset doesn't run in this repository, so this caller covers its pull requests and merge groups
# too.
#
# This repository publishes its _-prefixed shared workflows under release tags, so the caller also
# grades each pull request's impact on them against its title: one that breaks callers, e.g. by
# needing a new permission, needs a `type!:` title. .github/flowpact/flowpact.config.yml lists
# them under impact.publish. Edited reruns the check after the title is fixed.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions: {}

jobs:
  flowpact:
    name: flowpact
    # What the flowpact job of _flowpact.yml declares; a called job can't get more.
    permissions:
      contents: read # Check out the repository and fetch the base
    uses: $/.github/workflows/_flowpact.yml
    with:
      impact: auto
