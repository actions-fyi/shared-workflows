name: Check Workflow Data Flow
# This repository's caller of its own shared workflow _flowpact.yml, which holds the lint; see
# there. It calls the sibling with `$/`, so a pull request runs its own version of it. The org
# ruleset doesn't run in this repository, so this caller covers its pull requests and merge groups
# too.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  flowpact:
    name: flowpact
    # What the flowpact job of _flowpact.yml declares; a called job can't get more.
    permissions:
      contents: read # Check out the repository
    uses: $/.github/workflows/_flowpact.yml
