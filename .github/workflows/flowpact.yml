name: Check Workflow Data Flow
# This repository's caller of its own shared workflow _flowpact.yml, which holds the lint; see
# there. It calls the sibling with `$/`, so a pull request runs its own version of it. The org
# ruleset doesn't run in this repository, so this caller covers its pull requests and merge groups
# too, and pushes to main, where a failed check opens an issue.
#
# This repository publishes its _-prefixed shared workflows under release tags, and its custom
# property action-publishing is true, so the check also grades each pull request's impact on them
# against its title: one that breaks callers, e.g. by needing a new permission, needs a `type!:`
# title. .github/flowpact/flowpact.config.yml lists them under impact.publish. Edited reruns the
# check after the title is fixed.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  push:
    branches: [main]

permissions: {}

jobs:
  flowpact:
    name: flowpact
    # The union of what the jobs of _flowpact.yml declare; a called job can't get more.
    permissions:
      contents: read # Check out the repository and fetch the remote interfaces
      security-events: write # Upload the SARIF report to code scanning
      actions: read # Let upload-sarif read the workflow run
      id-token: write # Exchange an OIDC token with Octo STS to commit the remotes lockfile
      issues: write # Report a failed check on main
    uses: $/.github/workflows/_flowpact.yml
