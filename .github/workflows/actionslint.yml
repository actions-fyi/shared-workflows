name: Lint GitHub Actions
# This repository's caller of its own shared workflow _actionslint.yml, which holds the check; see
# there. It calls the sibling with `$/`, so a pull request runs its own version of it. The org
# ruleset doesn't run in this repository, so this caller covers its pull requests and merge groups.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  actionlint:
    name: actionlint
    # The union of what the jobs of _actionslint.yml declare; a called job can't get more.
    permissions:
      contents: read # Compare the changes and read the workflow files
    uses: $/.github/workflows/_actionslint.yml
