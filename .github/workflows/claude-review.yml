name: Claude Review
# This repository's caller of its own shared workflow _claude-review.yml, which holds the review;
# see there. It calls the sibling with `$/`, so a pull request runs its own version of it. The org
# ruleset doesn't run in this repository, so this caller covers its pull requests and merge groups.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  review:
    name: Review
    # The union of what the jobs of _claude-review.yml declare; a called job can't get more.
    permissions:
      actions: read # Find the last reviewed commit from this workflow's earlier runs
      contents: read # Check out the pull request
      id-token: write # Log in to OpenBao for Prompt Guard
      issues: write # Read the comments, and comment on a flagged pull request
      pull-requests: write # Read the thread, flag it, and post review comments
    uses: $/.github/workflows/_claude-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PROMPT_GUARD_CLIENT_ID: ${{ secrets.PROMPT_GUARD_CLIENT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
