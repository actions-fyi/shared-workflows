name: oxfmt
# A reusable workflow, not a ruleset workflow. It lives in actions-fyi/shared-workflows, which
# releases it under immutable tags, and formats a pull request with oxfmt, then hands the result to
# autofix.ci, whose GitHub App commits it. Callers call it by full path and tag. It runs as part of
# the caller's run: the caller's event, token and secrets. This repository has no package to
# format, so it has no caller of its own.
#
# The _ prefix marks a shared workflow: called only with workflow_call, never by events or rulesets.
#
# autofix.ci identifies the run by its workflow name, which a called workflow takes from its caller,
# so only the caller must be named `autofix.ci`. The app must also be installed in the repository
# (https://autofix.ci/setup). It can't be an org ruleset workflow: the app needs a workflow in the
# repository itself, so repositories get a caller from the oxfmt.yml template of
# actions-fyi/.github.
#
# oxfmt runs in the version the repository locks in package-lock.json or pnpm-lock.yaml, so the fix
# matches what its format:check enforces. The packageManager field of package.json names the
# manager, npm or pnpm, and the lockfile does when the field is missing. The install skips
# lifecycle scripts: only oxfmt's binary is needed. pnpm comes from pnpm/action-setup, set up after
# Node.js, in the version package.json pins, and in PNPM_VERSION below when it pins none; see
# _typescript.yml, which sets it up the same way. The install is cached the same way too, in the
# Actions cache, keyed on the lockfile's hash, in the pull request's own scope: npm's cache
# directory by setup-node, and pnpm's store, pruned, by pnpm/action-setup.
#
# autofix-ci/action refuses a diff that touches .github/ ("not allowed to modify the .github
# directory"), and oxfmt formats the YAML there too. So oxfmt's changes under .github/ are discarded
# before the handover, and everything else is still fixed. Unformatted files under .github/ stay
# for a person to fix; the repository's format:check still reports them.
#
# The calling job must grant what the oxfmt job declares:
#   contents: read  # check the repository out
on:
  workflow_call:

permissions: {}

env:
  # The pnpm of a package that pins none in packageManager or devEngines.packageManager.
  # renovate: datasource=npm depName=pnpm
  PNPM_VERSION: 12.23.0

jobs:
  oxfmt:
    name: oxfmt
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 10
    concurrency:
      group: oxfmt-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read # Check the repository out
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Only reads files. The outputs are fixed words, never text from package.json.
      - name: Find Package Manager
        id: manager
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ -f package.json ]] || fail "There's no package.json in the repository's root."
          manager="$(jq -r '(.packageManager // "") | tostring | split("@")[0] // ""' package.json)"
          if [[ -z "$manager" ]]; then
            if [[ -f package-lock.json ]]; then
              manager=npm
            elif [[ -f pnpm-lock.yaml ]]; then
              manager=pnpm
            else
              fail "There's no package-lock.json or pnpm-lock.yaml in the repository's root. oxfmt runs only in the version a lockfile locks. Commit the lockfile."
            fi
          fi
          case "$manager" in
            npm) lockfile=package-lock.json ;;
            pnpm) lockfile=pnpm-lock.yaml ;;
            *) fail "package.json names the package manager $manager, which this workflow doesn't support. It supports npm and pnpm." ;;
          esac
          [[ -f "$lockfile" ]] \
            || fail "There's no $lockfile in the repository's root. oxfmt runs only in the version a lockfile locks. Commit $lockfile."
          # pnpm/action-setup reads the version from package.json and fails when it's also given
          # one that differs, so it's given PNPM_VERSION only when package.json pins none.
          pnpm_version=""
          if [[ "$manager" == pnpm ]] && ! jq -e '
              ((.packageManager // "") | tostring | startswith("pnpm@"))
              or ((.devEngines.packageManager // null) | objects
                | .name == "pnpm" and ((.version // "") | tostring | length > 0))' \
              package.json > /dev/null; then
            pnpm_version="$PNPM_VERSION"
          fi
          {
            echo "manager=$manager"
            echo "lockfile=$lockfile"
            echo "pnpm-version=$pnpm_version"
          } >> "$GITHUB_OUTPUT"
      - name: Set Up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          # Caches ~/.npm for npm; pnpm's store is cached by pnpm/action-setup.
          cache: ${{ steps.manager.outputs.manager == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ steps.manager.outputs.lockfile }}
      # After Node.js, so pnpm 11 and earlier run on the repository's Node.js. An empty version
      # makes the action read the one package.json pins.
      - name: Set Up pnpm
        if: steps.manager.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ steps.manager.outputs.pnpm-version }}
          cache: true
      - name: Install Dependencies
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          case "$MANAGER" in
            npm) npm ci --ignore-scripts ;;
            pnpm) pnpm install --frozen-lockfile --ignore-scripts ;;
          esac
      # The action only prunes the store before saving it when it ran the install itself.
      - name: Prune pnpm Store
        if: steps.manager.outputs.manager == 'pnpm'
        run: pnpm store prune
      - name: Run oxfmt
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          if [[ "$MANAGER" == pnpm ]]; then
            pnpm exec oxfmt .
          else
            npx --no-install oxfmt .
          fi
      # autofix.ci can't change .github/; see the top.
      - name: Drop Changes Under .github
        run: git checkout -- .github
      # Must stay the job's last step: it hands the working tree's changes to autofix.ci.
      - name: Hand Over Fixes
        uses: autofix-ci/action@v1.3.4
