name: oxfmt
# A reusable workflow, not a ruleset workflow. It lives in actions-fyi/shared-workflows, which
# releases it under immutable tags, and formats a pull request with oxfmt, then hands the result to
# autofix.ci, whose GitHub App commits it. Callers call it by full path and tag. It runs as part of
# the caller's run: the caller's event, token and secrets. This repository has no package to
# format, so it has no caller of its own.
#
# The _ prefix marks a shared workflow: called only with workflow_call, never by events or rulesets.
#
# autofix.ci identifies the run by its workflow name, which a called workflow takes from its caller,
# so only the caller must be named `autofix.ci`. The app must also be installed in the repository
# (https://autofix.ci/setup). It can't be an org ruleset workflow: the app needs a workflow in the
# repository itself, so repositories get a caller from the oxfmt.yml template of
# actions-fyi/.github.
#
# oxfmt runs in the version the repository locks in package-lock.json, so the fix matches what its
# format:check enforces. The install skips lifecycle scripts: only oxfmt's binary is needed.
#
# The calling job must grant what the oxfmt job declares:
#   contents: read  # check the repository out
on:
  workflow_call:

permissions: {}

jobs:
  oxfmt:
    name: oxfmt
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 10
    concurrency:
      group: oxfmt-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read # Check the repository out
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Run oxfmt
        run: npx --no-install oxfmt .
      # Must stay the job's last step: it hands the working tree's changes to autofix.ci.
      - name: Hand Over Fixes
        uses: autofix-ci/action@v1.3.4
